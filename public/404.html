<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Finovo</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This redirects a deep-linked or refreshed URL back to index.html,
      // encoding the real path in the query string so it can be restored there.
      var pathSegmentsToKeep = 0; // custom domain serves from root

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
